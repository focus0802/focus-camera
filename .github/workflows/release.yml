name: Build & Publish Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag version (e.g. v2.2.0)"
        required: true
        default: "v2.2.0"

permissions:
  contents: write

jobs:
  release:
    name: Build Windows & macOS Desktop Clients
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web-ui/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Determine Release Version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ github.event.inputs.version }}"
          else
            VER="${GITHUB_REF_NAME}"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Building FocusCamera ${VER}"

      - name: Build Frontend Assets (@uiarc + React + Vite)
        working-directory: web-ui
        run: |
          npm ci
          npm run build

      - name: Run Unit Tests
        run: |
          go test -mod=vendor -v ./internal/updater .

      - name: Build macOS & Windows Executables and Generate version.json
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X focus-camera/internal/updater.CurrentVersion=${RELEASE_VERSION}"

          # 1. Build macOS Native App Binary (with native WKWebView support)
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -mod=vendor -ldflags "${LDFLAGS}" -o dist/FocusCamera-Mac .
          codesign --force --sign - dist/FocusCamera-Mac

          # 2. Build Windows x64 GUI & Console Binaries
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -mod=vendor -ldflags "${LDFLAGS} -H=windowsgui" -o dist/FocusCamera-Windows-x64.exe .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -mod=vendor -ldflags "${LDFLAGS}" -o dist/FocusCamera-Windows-Console.exe .

          # 3. Compute SHA-256 & File Sizes and Generate version.json
          MAC_SHA=$(shasum -a 256 dist/FocusCamera-Mac | awk '{print $1}')
          MAC_SIZE=$(stat -f%z dist/FocusCamera-Mac)
          WIN_SHA=$(shasum -a 256 dist/FocusCamera-Windows-x64.exe | awk '{print $1}')
          WIN_SIZE=$(stat -f%z dist/FocusCamera-Windows-x64.exe)
          PUB_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          cat > dist/version.json <<EOF
          {
            "version": "${RELEASE_VERSION}",
            "published_at": "${PUB_DATE}",
            "notes": "FocusCamera ${RELEASE_VERSION} 沉浸式桌面顶栏、系统托盘静默录制与全能云台升级版：\n1. 双端沉浸式一体化顶栏：macOS（左上原生红绿灯）与 Windows（右上自定义最小化/最大化/关闭按钮）视觉统一，支持拖拽移动、双击最大化与深浅主题联动\n2. 系统托盘后台静默常驻：关闭主窗口时弹出 @uiarc/dialog 确认框，支持最小化至 Windows 右下角系统托盘 / macOS 右上角菜单栏托盘，后台 1080P 录像不中断\n3. 高屏占比一屏监控墙：监控卡片升级为画面底部渐变浮层 HUD，全览模式自适应视口网格高度，26+ 路画面一屏完整显示无滚动条\n4. 全平台专属高清图标：内置 macOS AppIcon.icns 与 Windows PE rsrc_windows_amd64.syso 多图层图标资源\n5. 物理云台控制、多品牌 ONVIF 扫描与机身静态 IP 直接修改，并修复带元数据轨摄像头的电流杂音问题",
            "assets": {
              "darwin_arm64": {
                "url": "FocusCamera-Mac",
                "sha256": "${MAC_SHA}",
                "size": ${MAC_SIZE}
              },
              "windows_amd64": {
                "url": "FocusCamera-Windows-x64.exe",
                "sha256": "${WIN_SHA}",
                "size": ${WIN_SIZE}
              }
            }
          }
          EOF
          cat dist/version.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: "FocusCamera ${{ steps.ver.outputs.version }}"
          generate_release_notes: true
          files: |
            dist/version.json
            dist/FocusCamera-Windows-x64.exe
            dist/FocusCamera-Windows-Console.exe
            dist/FocusCamera-Mac
