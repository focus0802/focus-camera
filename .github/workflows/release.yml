name: Build & Publish Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag version (e.g. v2.3.1)"
        required: true
        default: "v2.3.1"

permissions:
  contents: write

jobs:
  release:
    name: Build Windows & macOS Desktop Clients
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web-ui/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Determine Release Version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ github.event.inputs.version }}"
          else
            VER="${GITHUB_REF_NAME}"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Building FocusCamera ${VER}"

      - name: Build Frontend Assets (@uiarc + React + Vite)
        working-directory: web-ui
        run: |
          npm ci
          npm run build

      - name: Run Unit Tests
        run: |
          go test -mod=vendor -ldflags="-linkmode=external" -v ./internal/updater ./internal/autostart .

      - name: Build macOS & Windows Executables and Generate version.json
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X focus-camera/internal/updater.CurrentVersion=${RELEASE_VERSION}"

          # 1. Build macOS Native App Binary (with native WKWebView support)
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -mod=vendor -ldflags "${LDFLAGS}" -o dist/FocusCamera-Mac .
          codesign --force --sign - dist/FocusCamera-Mac

          # 2. Build Windows x64 GUI & Console Binaries (keep symbols on Windows to avoid Defender ML false positives)
          WIN_LDFLAGS="-X focus-camera/internal/updater.CurrentVersion=${RELEASE_VERSION}"
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -mod=vendor -ldflags "${WIN_LDFLAGS} -H=windowsgui" -o dist/FocusCamera-Windows-x64.exe .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -mod=vendor -ldflags "${WIN_LDFLAGS}" -o dist/FocusCamera-Windows-Console.exe .

          # 3. Compute SHA-256 & File Sizes and Generate version.json
          MAC_SHA=$(shasum -a 256 dist/FocusCamera-Mac | awk '{print $1}')
          MAC_SIZE=$(stat -f%z dist/FocusCamera-Mac)
          WIN_SHA=$(shasum -a 256 dist/FocusCamera-Windows-x64.exe | awk '{print $1}')
          WIN_SIZE=$(stat -f%z dist/FocusCamera-Windows-x64.exe)
          PUB_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          cat > dist/version.json <<EOF
          {
            "version": "${RELEASE_VERSION}",
            "published_at": "${PUB_DATE}",
            "notes": "FocusCamera ${RELEASE_VERSION} 桌面端顶栏自由拖动与工作区固定尺寸优化版：\n1. 恢复顶栏自由拖动窗口：保持窗口固定为桌面工作区尺寸（不可缩放/调整大小），同时支持按住顶部导航栏自由拖动窗口（适配多显示器移动场景）\n2. 沉浸式大屏模式与浮动控制抽屉：支持一键进入 100% 满屏沉浸监控墙模式、鼠标触顶呼出顶栏、快捷键快速切换宫格与全局命令面板 (⌘K / /)\n3. 系统设置中心与开机静默自启：统一管理双平台开机自启、录像存储目录原生选择、循环覆盖与定时录像策略",
            "assets": {
              "darwin_arm64": {
                "url": "FocusCamera-Mac",
                "sha256": "${MAC_SHA}",
                "size": ${MAC_SIZE}
              },
              "windows_amd64": {
                "url": "FocusCamera-Windows-x64.exe",
                "sha256": "${WIN_SHA}",
                "size": ${WIN_SIZE}
              }
            }
          }
          EOF
          cat dist/version.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: "FocusCamera ${{ steps.ver.outputs.version }}"
          generate_release_notes: true
          files: |
            dist/version.json
            dist/FocusCamera-Windows-x64.exe
            dist/FocusCamera-Windows-Console.exe
            dist/FocusCamera-Mac
